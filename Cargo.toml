[workspace]
resolver = "2"
members = ["crates/twin-core", "crates/twin", "crates/twin-app", "crates/menu-icon"]
# The iPhone helper builds on its own, with apple/ (macOS only)
exclude = ["apple/hid"]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ovitrif/twin"

[workspace.dependencies]
twin-core = { path = "crates/twin-core" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
crossterm = "0.28"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
